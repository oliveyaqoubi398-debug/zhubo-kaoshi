</head>

let timeLeft = 30 * 60;
let timerInterval;

function initExam() {
    const form = document.getElementById("exam-form");
    questions.forEach((q, idx) => {
        let typeText = q.type === "single" ? "单选题" : q.type === "multiple" ? "多选题" : "判断题";
        let qDiv = document.createElement("div");
        qDiv.className = "question-card";
        qDiv.innerHTML = `
            <div class="q-type">${typeText}</div>
            <div class="q-title">${idx + 1}. ${q.title}</div>
            <div class="options">
                ${q.options.map(opt => `
                    <label class="option-item">
                        <input type="${q.type === 'multiple' ? 'checkbox' : 'radio'}" name="q${q.id}" value="${opt[0]}">
                        ${opt}
                    </label>
                `).join("")}
            </div>
        `;
        form.appendChild(qDiv);
    });
    startTimer();
}

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById("timer").innerText = 
            `剩余时间：${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }, 1000);
}

async function submitExam() {
    clearInterval(timerInterval);
    const userName = document.getElementById("name").value.trim();
    const userId = document.getElementById("id").value.trim();
    if (!userName) {
        alert("请填写姓名后再提交！");
        return;
    }

    let score = 0;
    questions.forEach(q => {
        let sel = document.querySelectorAll(`input[name="q${q.id}"]:checked`);
        let ans = q.type === "multiple" 
            ? Array.from(sel).map(el => el.value).sort().join("")
            : (sel[0] ? sel[0].value : "");
        if (ans === q.answer) score++;
    });

    try {
        await fetch("https://sheetdb.io/api/v1/89y44z0xm1ql5", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: userName,
                id: userId || "无",
                score: score,
                time: new Date().toLocaleString()
            })
        });
    } catch (e) {}

    document.getElementById("exam-form").style.display = "none";
    document.querySelector(".submit-btn").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("score").innerText = `得分：${score}/40`;
    
    let resText = score >= 36 
        ? `恭喜${userName}！考核通过`
        : `${userName}，考核未通过`;
    document.getElementById("result-text").innerText = resText;
}

window.onload = initExam;
</script>
</body>
</html>
