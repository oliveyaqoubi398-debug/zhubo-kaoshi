    <title>抖音虚假宣传实施规则考题</title>
    <style>

</head>

let timeLeft = 30 * 60;
let timerInterval;

function initExam() {
    const form = document.getElementById("exam-form");
    questions.forEach((q, idx) => {
        let typeText = q.type === "single" ? "单选题" : q.type === "multiple" ? "多选题" : "判断题";
        let qDiv = document.createElement("div");
        qDiv.className = "question";
        qDiv.innerHTML = `
            <div class="q-type">${typeText}</div>
            <div class="question-title">${idx + 1}. ${q.title}</div>
            <div class="options">
                ${q.options.map(opt => `
                    <div class="option">
                        <input type="${q.type === 'multiple' ? 'checkbox' : 'radio'}" name="q${q.id}" value="${opt[0]}">
                        ${opt}
                    </div>
                `).join("")}
            </div>
        `;
        form.appendChild(qDiv);
    });
    startTimer();
}

function startTimer() {
    timerInterval = setInterval(() => {
        timeLeft--;
        let m = Math.floor(timeLeft / 60);
        let s = timeLeft % 60;
        document.getElementById("timer").innerText = `剩余时间：${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            submitExam();
        }
    }, 1000);
}

function submitExam() {
    clearInterval(timerInterval);
    const userName = document.getElementById("name").value.trim();
    const userId = document.getElementById("id").value.trim();
    if (!userName) {
        alert("请填写姓名后再提交！");
        return;
    }

    let score = 0;
    let errList = [];
    questions.forEach(q => {
        let sel = document.querySelectorAll(`input[name="q${q.id}"]:checked`);
        let ans;
        if (q.type === "multiple") {
            ans = Array.from(sel).map(el => el.value).sort().join("");
        } else {
            ans = sel[0] ? sel[0].value : "";
        }
        if (ans === q.answer) {
            score++;
        } else {
            errList.push({
                id: q.id,
                title: q.title,
                user: ans || "未作答",
                right: q.answer
            });
        }
    });

    saveScoreToLocal(userName, userId, score);

    document.getElementById("exam-form").style.display = "none";
    document.querySelector(".submit-btn").style.display = "none";
    document.getElementById("result").style.display = "block";
    document.getElementById("score").innerText = `得分：${score}/40`;
    
    let resText = "";
    if (score >= 36) {
        resText = `恭喜${userName}！考核通过，直播售后规则掌握良好。`;
    } else if (score >= 32) {
        resText = `${userName}，考核及格（${score}分），仍需加强直播售后规则学习。`;
    } else {
        resText = `${userName}，考核未通过（${score}分），请重新学习后再参加考核。`;
    }
    document.getElementById("result-text").innerText = resText;

    let errHtml = `<h3>错题回顾（共${errList.length}题）</h3>`;
    if (errList.length === 0) {
        errHtml = "<h3>恭喜！全部答对，无错题</h3>";
    } else {
        errList.forEach(e => {
            errHtml += `<p><strong>${e.id}. ${e.title}</strong><br>你的答案：${e.user}<br>正确答案：${e.right}</p>`;
        });
    }
    document.getElementById("error-list").innerHTML = errHtml;
}

function saveScoreToLocal(name, id, score) {
    let scores = JSON.parse(localStorage.getItem("examScores")) || [];
    scores.push({
        name: name,
        id: id || "无工号",
        score: score,
        time: new Date().toLocaleString()
    });
    localStorage.setItem("examScores", JSON.stringify(scores));
}

window.onload = initExam;
</script>
</body>
</html>
