<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩统计后台</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: "Microsoft YaHei",sans-serif;}
        body{background:#f8f5f0;padding:20px 0;}
        /* 整体居中容器 */
        .wrap{max-width:1200px;margin:0 auto;background:#fff;}
        /* 顶部logo导航栏 */
        .header-bar{background:#000;display:flex;align-items:center;justify-content:space-between;padding:15px 20px;}
        .logo-area{display:flex;align-items:center;gap:12px;}
        .logo-area img{height:40px;width:auto;}
        .brand-name{color:#d4af37;font-size:28px;font-weight:bold;}
        .title-top{padding:30px 20px;text-align:center;}
        .title-top h1{font-size:24px;color:#333;margin-bottom:10px;}
        .tip{color:#666;font-size:16px;}
        .total{text-align:center;margin:15px 0;font-size:18px;}
        .refresh{display:block;margin:20px auto;padding:12px 30px;background:#d4af37;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;}
        table{width:96%;margin:0 auto;border-collapse:collapse;}
        th,td{padding:12px;text-align:center;border:1px solid #ddd;}
        th{background:#f8f8f8;font-weight:bold;}
        tr:nth-child(even){background:#fafafa;}
        .pass{color:green;font-weight:bold;}
        .fail{color:red;font-weight:bold;}
    </style>
</head>
<body>
    <div class="wrap">
        <!-- 顶部Logo栏 和 考试页同款 -->
        <div class="header-bar">
            <div class="logo-area">
                <img src="logo.png" alt="钱皇蚕丝LOGO">
                <span class="brand-name">钱皇蚕丝</span>
            </div>
        </div>

        <div class="title-top">
            <h1>主播考核成绩统计后台</h1>
            <div class="tip">满分：40分 &nbsp;&nbsp; 及格线：≥36分</div>
        </div>

        <div class="total" id="total"></div>
        <button class="refresh" onclick="loadScores()">刷新成绩</button>

        <table>
            <thead>
                <tr>
                    <th>序号</th>
                    <th>姓名</th>
                    <th>工号</th>
                    <th>得分</th>
                    <th>考核结果</th>
                    <th>考试时间</th>
                </tr>
            </thead>
            <tbody id="scoreBody"></tbody>
        </table>
    </div>

<script>
async function loadScores() {
    let res = await fetch("https://sheetdb.io/api/v1/89y44z0xm1ql5");
    let scores = await res.json();
    let body = document.getElementById("scoreBody");
    let total = document.getElementById("total");
    body.innerHTML = "";

    let pass = 0, fail = 0;
    scores.forEach((s, i) => {
        let sc = parseInt(s.score);
        let ok = sc >= 36;
        if(ok) pass++; else fail++;
        let tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${i+1}</td>
            <td>${s.name}</td>
            <td>${s.id}</td>
            <td>${sc}/40</td>
            <td class="${ok ? 'pass' : 'fail'}">${ok ? '通过' : '未通过'}</td>
            <td>${s.time}</td>
        `;
        body.appendChild(tr);
    });

    total.innerText = `总人数：${scores.length} 人 | 通过：${pass} 人 | 未通过：${fail} 人`;
}
window.onload = loadScores;
</script>
</body>
</html>
